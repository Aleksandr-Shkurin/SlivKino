<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сливкино - Админ-панель</title>
<script src="js/data-loader.js"></script>
<script src="js/movies-data.js"></script>
<script src="js/cinemas-data.js"></script>
<script src="js/admin.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <a href="index.html" class="logo">Сливкино</a>
            <nav class="sub-nav">
                <a href="index.html">Афиша</a>
                <a href="cinemas.html">Кинотеатры</a>
                <a href="admin.html" class="active">Админ-панель</a>
            </nav>
        </header>

        <div class="admin-container">
            <div class="admin-header">
                <h1>👑 Админ-панель</h1>
                <div class="header-buttons">
                    <button class="btn btn-primary" onclick="adminApp.exportData()">📥 Экспорт</button>
                    <button class="btn btn-warning" onclick="adminApp.importData()">📤 Импорт</button>
                    <button class="btn btn-danger" onclick="adminApp.resetData()">🔄 Сброс</button>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="movies" onclick="adminApp.showTab('movies')">🎬 Фильмы</button>
                <button class="tab-btn" data-tab="cinemas" onclick="adminApp.showTab('cinemas')">🏢 Кинотеатры</button>
                <button class="tab-btn" data-tab="halls" onclick="adminApp.showTab('halls')">🪑 Залы</button>
                <button class="tab-btn" data-tab="sessions" onclick="adminApp.showTab('sessions')">🎫 Сеансы</button>
                <button class="tab-btn" data-tab="bookings" onclick="adminApp.showTab('bookings')">📊 Бронирования</button>
            </div>

            <!-- Фильмы -->
            <div id="tab-movies" class="tab-content active">
                <div class="panel-header">
                    <button class="btn btn-success" onclick="adminApp.openMovieModal()">+ Добавить фильм</button>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead>
                            <tr><th>ID</th><th>Постер</th><th>Название</th><th>Жанры</th><th>Год</th><th>Возраст</th><th>Действия</th></tr>
                        </thead>
                        <tbody id="movies-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Кинотеатры -->
            <div id="tab-cinemas" class="tab-content">
                <div class="panel-header">
                    <button class="btn btn-success" onclick="adminApp.openCinemaModal()">+ Добавить кинотеатр</button>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Название</th><th>Адрес</th><th>Телефон</th><th>Оснащение</th><th>Действия</th></tr></thead>
                        <tbody id="cinemas-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Залы -->
            <div id="tab-halls" class="tab-content">
                <div class="panel-header">
                    <select id="hall-cinema-select" class="cinema-select" onchange="adminApp.loadHallsList()">
                        <option value="">Выберите кинотеатр</option>
                    </select>
                    <button class="btn btn-success" onclick="adminApp.openHallModal()">+ Добавить зал</button>
                </div>
                <div id="halls-list-container"></div>
            </div>

            <!-- Сеансы -->
            <div id="tab-sessions" class="tab-content">
                <div class="panel-header">
                    <button class="btn btn-success" onclick="adminApp.openSessionModal()">+ Добавить сеанс</button>
                </div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Фильм</th><th>Кинотеатр</th><th>Зал</th><th>Время</th><th>Цена</th><th>Действия</th></tr></thead>
                        <tbody id="sessions-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- Бронирования -->
            <div id="tab-bookings" class="tab-content">
                <div id="bookings-stats" class="stats-cards"></div>
                <div class="table-wrapper">
                    <table class="data-table">
                        <thead><tr><th>Фильм</th><th>Кинотеатр</th><th>Зал</th><th>Время</th><th>Места</th><th>Статус</th><th>Действия</th></tr></thead>
                        <tbody id="bookings-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно фильма -->
    <div id="movie-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="movie-modal-title">Добавить фильм</h3>
                <button class="modal-close" onclick="adminApp.closeModal('movie-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="movie-id">
                <div class="form-row">
                    <div class="form-group"><label>Название *</label><input type="text" id="movie-title" placeholder="Название"></div>
                    <div class="form-group"><label>Название (англ.)</label><input type="text" id="movie-title-en" placeholder="English title"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Жанры * (через запятую)</label><input type="text" id="movie-genres" placeholder="триллер, драма, комедия"></div>
                    <div class="form-group"><label>Страна</label><input type="text" id="movie-country" placeholder="США, Россия"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Год</label><input type="number" id="movie-year" placeholder="2024"></div>
                    <div class="form-group"><label>Возрастной рейтинг</label><input type="text" id="movie-age" placeholder="12+, 16+, 18+"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Дата выхода</label><input type="date" id="movie-release"></div>
                    <div class="form-group"><label>Дата окончания</label><input type="date" id="movie-end"></div>
                </div>
                <div class="form-group"><label>Ссылка на постер (URL)</label><input type="text" id="movie-poster" placeholder="https://..."></div>
                <div class="form-group"><label>Описание</label><textarea id="movie-description" rows="3"></textarea></div>
                <div class="form-group"><label>Режиссер</label><input type="text" id="movie-director"></div>
                <div class="form-group"><label>Актеры (через запятую)</label><input type="text" id="movie-cast"></div>
                <div class="form-group"><label>Длительность</label><input type="text" id="movie-duration" placeholder="120 минут"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="adminApp.closeModal('movie-modal')">Отмена</button>
                <button class="btn btn-success" onclick="adminApp.saveMovie()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно кинотеатра -->
    <div id="cinema-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="cinema-modal-title">Добавить кинотеатр</h3>
                <button class="modal-close" onclick="adminApp.closeModal('cinema-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="cinema-id">
                <div class="form-group"><label>Название *</label><input type="text" id="cinema-name"></div>
                <div class="form-group"><label>Адрес</label><input type="text" id="cinema-address"></div>
                <div class="form-row">
                    <div class="form-group"><label>Телефон</label><input type="text" id="cinema-phone"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="cinema-email"></div>
                </div>
                <div class="form-group"><label>Режим работы</label><input type="text" id="cinema-hours"></div>
                <div class="form-group"><label>Описание</label><textarea id="cinema-description" rows="3"></textarea></div>
                <div class="form-group"><label>Оснащение (через запятую)</label><input type="text" id="cinema-features" placeholder="IMAX, 3D, VIP"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="adminApp.closeModal('cinema-modal')">Отмена</button>
                <button class="btn btn-success" onclick="adminApp.saveCinema()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно зала -->
    <div id="hall-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Добавить зал</h3>
                <button class="modal-close" onclick="adminApp.closeModal('hall-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="hall-cinema-id">
                <input type="hidden" id="hall-id">
                <div class="form-group"><label>Название зала</label><input type="text" id="hall-name"></div>
                <div class="form-row">
                    <div class="form-group"><label>Рядов</label><input type="number" id="hall-rows" value="8"></div>
                    <div class="form-group"><label>Мест в ряду</label><input type="number" id="hall-seats-per-row" value="12"></div>
                </div>
                <div class="form-group"><label>VIP места (ряд-место, через запятую)</label><input type="text" id="hall-vip-seats" placeholder="3-4, 3-5"></div>
                <div class="form-group"><label>Места для инвалидов</label><input type="text" id="hall-disabled-seats" placeholder="1-1, 1-12"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="adminApp.closeModal('hall-modal')">Отмена</button>
                <button class="btn btn-success" onclick="adminApp.saveHall()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно сеанса -->
    <div id="session-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Добавить сеанс</h3>
                <button class="modal-close" onclick="adminApp.closeModal('session-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>Фильм</label><select id="session-movie"></select></div>
                <div class="form-group"><label>Кинотеатр</label><select id="session-cinema" onchange="adminApp.updateHallOptions()"></select></div>
                <div class="form-group"><label>Зал</label><select id="session-hall"></select></div>
                <div class="form-row">
                    <div class="form-group"><label>Дата и время</label><input type="datetime-local" id="session-time"></div>
                    <div class="form-group"><label>Цена (₽)</label><input type="number" id="session-price"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="adminApp.closeModal('session-modal')">Отмена</button>
                <button class="btn btn-success" onclick="adminApp.saveSession()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="js/movies-data.js"></script>
    <script src="js/cinemas-data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
